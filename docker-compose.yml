services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orion_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orion_admin}:${POSTGRES_PASSWORD:-orion_password}@db:5432/${POSTGRES_DB:-orion_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-orion_jwt_secret_super_seguro}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-orion_app_encryption_key_12345}
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

  db:
    image: postgres:15-alpine
    container_name: orion_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion_password}
      POSTGRES_DB: ${POSTGRES_DB:-orion_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion_admin} -d ${POSTGRES_DB:-orion_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
